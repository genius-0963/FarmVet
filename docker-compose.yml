services:
  postgres:
    image: postgres:16-alpine
    container_name: farmvet-postgres
    environment:
      POSTGRES_DB: farmvet_db
      POSTGRES_USER: farmvet_user
      POSTGRES_PASSWORD: farmvet_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmvet_user -d farmvet_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmvet-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: farmvet-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - farmvet-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmvet-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/farmvet_db
      DATABASE_USER: farmvet_user
      DATABASE_PASSWORD: farmvet_secure_password_2026
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_STORAGE_UPLOAD_DIR: /app/uploads
      APP_JWT_SECRET: ${APP_JWT_SECRET:-SuperSecretFarmVetKey2026WithAtLeast256BitsLengthForHmacSha256Security!}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://farmvetconnect.vercel.app}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_uploads:/app/uploads
    networks:
      - farmvet-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmvet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - farmvet-network
    restart: unless-stopped

networks:
  farmvet-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  app_uploads:
