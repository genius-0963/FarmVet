spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

server.port=${PORT:8082}

# Spring Boot Actuator Endpoints for Docker/Kubernetes Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# App Uploads and Storage
app.upload.dir=${APP_STORAGE_UPLOAD_DIR:uploads}
app.jwt.secret=${APP_JWT_SECRET:SuperSecretFarmVetKey2026WithAtLeast256BitsLengthForHmacSha256Security!}

logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN
logging.level.com.example.demo=INFO

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Free AI Engine Configuration
# Works out-of-the-box with zero keys via FarmVet Built-in Agro-AI & Public Open Endpoints.
# Optionally add your free API key below or pass it via GEMINI_API_KEY / GROQ_API_KEY environment variables:
gemini.api.key=${GEMINI_API_KEY:}
groq.api.key=${GROQ_API_KEY:}
openrouter.api.key=${OPENROUTER_API_KEY:}
