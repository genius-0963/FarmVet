# Production Configuration for FarmVet Backend
server.port=${PORT:8082}

# Production Database (PostgreSQL / PostGIS)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/farmvet_db}
spring.datasource.username=${DATABASE_USER:farmvet_user}
spring.datasource.password=${DATABASE_PASSWORD:farmvet_secure_password_2026}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# Hikari Connection Pool Optimization for Production
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Actuator Health Probes for Docker / Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Logging in Production
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.example.demo=INFO

# File Upload Storage
app.upload.dir=${APP_STORAGE_UPLOAD_DIR:/app/uploads}
